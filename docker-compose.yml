# Mexanika Akademiyasi — to'liq stek
#
#   docker compose up --build
#     frontend : http://localhost:8080
#     backend  : http://localhost:8000/docs
#
# Animatsiyalarni render qilish (alohida, katta tasvir):
#   docker compose --profile manim run --rm manim

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: mexanika-backend:1.0.0
    container_name: mexanika-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/backend/data
    environment:
      MEXANIKA_LAB_WALL_SECONDS: "20"
      MEXANIKA_LAB_CPU_SECONDS: "15"
      MEXANIKA_LAB_MEMORY_MB: "768"
      MEXANIKA_LAB_RATE_PER_MINUTE: "20"
      MEXANIKA_CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
    # --- Sandbox uchun konteyner darajasidagi cheklovlar ---
    # Bu qatlam backend ichidagi himoyaga QO'SHIMCHA: hatto sandbox
    # buzilgan taqdirda ham jarayon imtiyoz ola olmaydi.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: mexanika-frontend:1.0.0
    container_name: mexanika-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Ixtiyoriy: animatsiyalarni render qilish. Asosiy stek bilan
  # birga ishga tushmaydi — faqat --profile manim bilan.
  manim:
    build:
      context: .
      dockerfile: docker/manim.Dockerfile
    image: mexanika-manim:1.0.0
    profiles: ["manim"]
    volumes:
      - ./animatsiya/media:/app/animatsiya/media

volumes:
  backend-data:
